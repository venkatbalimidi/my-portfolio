spring.application.name=portfolio-backend

spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cv.file.path=${CV_FILE_PATH:storage/Venkat_Balimidi_CV.pdf}

portfolio.admin.username=${ADMIN_USERNAME:admin}
portfolio.admin.password=${ADMIN_PASSWORD}

portfolio.frontend.url=${FRONTEND_URL:http://localhost:4200}